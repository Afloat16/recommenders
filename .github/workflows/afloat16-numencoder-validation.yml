name: Validate NumEncoder fixes
on:
  push:
    branches: [validation/recommenders-numencoder-20261116]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core and development requirements
        run: python -m pip install -e '.[dev]'
      - name: Compare unchanged staging and each exact fix
        run: python .validation/validate_numencoder.py
      - name: Save regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numencoder-python-${{ matrix.python-version }}
          path: .validation/results/
