name: Validate GeoIMC square-root reuse
on:
  push:
    branches:
      - validation/recommenders-geoimc-root-20261116
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            numpy-version: '1.24.4'
            numba-version: '0.57.1'
            scipy-version: '1.10.1'
          - python-version: '3.11'
            numpy-version: '1.26.4'
            numba-version: '0.61.2'
            scipy-version: '1.13.1'
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install documented Pymanopt revision and compatible native dependencies
        run: |
          python -m pip install -e '.[dev]' numpy==${{ matrix.numpy-version }} scipy==${{ matrix.scipy-version }} numba==${{ matrix.numba-version }} 'pymanopt @ git+https://github.com/pymanopt/pymanopt@fb36a272cdeecb21992cfd9271eb82baafeb316d'
      - name: Verify baseline and exact contribution head
        run: python .validation/validate_geoimc_square_root.py
      - name: Record dependency versions
        run: python -m pip freeze > .validation/results/dependencies.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geoimc-root-python-${{ matrix.python-version }}
          path: .validation/results
