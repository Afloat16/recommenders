name: Validate SLi-Rec numerical fixes
on:
  push:
    branches:
      - validation/recommenders-slirec-20261116
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install official CPU Torch and repository requirements
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Verify baseline and both exact contribution heads
        run: python .validation/validate_slirec.py
      - name: Record dependency versions
        run: python -m pip freeze > .validation/results/dependencies.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slirec-validation-python-${{ matrix.python-version }}
          path: .validation/results
